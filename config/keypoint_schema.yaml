# COCO-WholeBody style foot keypoints for gait analysis
# Used by training (Ultralytics format) and inference (event detection)
# Minimum: heel + big toe per foot; full: heel + big toe + small toe per foot

name: coco_wholebody_foot
description: "Foot keypoints for gait (heel, big toe, small toe per foot)"

# Keypoint names in order (Ultralytics keypoint index = list index)
keypoints:
  - L_HEEL
  - L_BIG_TOE
  - L_SMALL_TOE
  - R_HEEL
  - R_BIG_TOE
  - R_SMALL_TOE

# Skeleton edges for visualization (pairs of keypoint indices)
skeleton:
  - [0, 1]   # L_HEEL - L_BIG_TOE
  - [1, 2]   # L_BIG_TOE - L_SMALL_TOE
  - [2, 0]   # L_SMALL_TOE - L_HEEL
  - [3, 4]   # R_HEEL - R_BIG_TOE
  - [4, 5]   # R_BIG_TOE - R_SMALL_TOE
  - [5, 3]   # R_SMALL_TOE - R_HEEL

# Indices for code
indices:
  L_HEEL: 0
  L_BIG_TOE: 1
  L_SMALL_TOE: 2
  R_HEEL: 3
  R_BIG_TOE: 4
  R_SMALL_TOE: 5

# Minimum keypoints required (heel + big toe per foot)
min_for_gait:
  left: [0, 1]   # L_HEEL, L_BIG_TOE
  right: [3, 4]  # R_HEEL, R_BIG_TOE
