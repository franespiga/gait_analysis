# ─────────────────────────────────────────────────────────────────────
# Stage A — Full-body HALPE-26 pose training config
# Model:  yolo11s-pose  (small, good accuracy/speed for 26 keypoints)
# Target: pediatric gait — children walking (side-view mobile video)
# ─────────────────────────────────────────────────────────────────────

# ── Model ────────────────────────────────────────────────────────────
model: yolo11s-pose.pt          # pretrained small-pose backbone
task: pose

# ── Data ─────────────────────────────────────────────────────────────
data: data/halpe26_yolo_pose/halpe26-pose.yaml   # generated by convert_halpe26_to_yolo_pose.py

# ── Resolution & multi-scale ────────────────────────────────────────
# Children's feet are small in pixels → use higher base resolution.
# multi_scale jitters ±25 % around imgsz each batch (→ 576–960 range).
imgsz: 768
multi_scale: 0.25               # native Ultralytics multi-scale (float)

# ── Epochs & early stopping ─────────────────────────────────────────
epochs: 200
patience: 20                    # stop after 20 epochs with no val improvement

# ── Batch & workers ─────────────────────────────────────────────────
batch: 8                        # adjust to GPU VRAM (768px needs ~12–16 GB at bs=8)
workers: 8

# ── Optimizer & schedule ────────────────────────────────────────────
optimizer: auto                 # SGD for large batch, AdamW otherwise
lr0: 0.01
lrf: 0.001                     # final LR = lr0 * lrf
cos_lr: true                   # cosine annealing
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
momentum: 0.937
weight_decay: 0.0005

# ── Loss weights ────────────────────────────────────────────────────
box: 7.5
cls: 0.5
dfl: 1.5
pose: 14.0                     # global keypoint loss gain (raised from 12.0)
kobj: 1.0

# ── AMP & reproducibility ───────────────────────────────────────────
amp: true                      # mixed precision; disable if NaN gradients occur
deterministic: true
seed: 42

# ── Augmentation — pediatric / mobile-video oriented ────────────────
augment: true

# Colour jitter (indoor lighting + outdoor, phone cameras)
hsv_h: 0.02                    # hue ±2 % (moderate)
hsv_s: 0.7                     # saturation ±70 %
hsv_v: 0.5                     # value/brightness ±50 %

# Geometric — keep full legs + feet in frame
degrees: 5.0                   # small rotation (walking is roughly level)
translate: 0.15                # translate ±15 % of image
scale: 0.4                     # zoom ±40 % (avoid cutting feet)
shear: 2.0                     # light shear
perspective: 0.0002            # subtle perspective warp
flipud: 0.0                    # never vertical flip
fliplr: 0.5                    # horizontal flip (uses flip_idx in dataset YAML)

# Mosaic / mixup / copy-paste
mosaic: 1.0                    # full mosaic during training
mixup: 0.15                    # light mixup
copy_paste: 0.1                # light copy-paste
close_mosaic: 15               # disable mosaic for last 15 epochs (stabilises small objects)

# Random erasing — simulate partial occlusion
erasing: 0.3                   # moderate erasing probability

# ── Pretrained / resume ─────────────────────────────────────────────
pretrained: true
resume: false

# ── Output paths ─────────────────────────────────────────────────────
project: runs/pose
name: halpe26_stage_a
save: true
exist_ok: false
plots: true
val: true

# ── Per-keypoint loss weighting (custom trainer only) ────────────────
# Not a native Ultralytics key — read by scripts/train_halpe_stage_a.py
# Format: 26 weights aligned to HALPE-26 indices.
# Baseline 1.0; ankles (15,16) 2.0; toes+heels (20-25) 3.0
kpt_weights:
  - 1.0   # 0  Nose
  - 1.0   # 1  LEye
  - 1.0   # 2  REye
  - 1.0   # 3  LEar
  - 1.0   # 4  REar
  - 1.0   # 5  LShoulder
  - 1.0   # 6  RShoulder
  - 1.0   # 7  LElbow
  - 1.0   # 8  RElbow
  - 1.0   # 9  LWrist
  - 1.0   # 10 RWrist
  - 1.0   # 11 LHip
  - 1.0   # 12 RHip
  - 1.0   # 13 LKnee
  - 1.0   # 14 RKnee
  - 2.0   # 15 LAnkle
  - 2.0   # 16 RAnkle
  - 1.0   # 17 Head
  - 1.0   # 18 Neck
  - 1.0   # 19 Hip
  - 3.0   # 20 LBigToe
  - 3.0   # 21 RBigToe
  - 3.0   # 22 LSmallToe
  - 3.0   # 23 RSmallToe
  - 3.0   # 24 LHeel
  - 3.0   # 25 RHeel
