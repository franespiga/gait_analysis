# Inference config for gait analysis pipeline
# Used by scripts/infer_video.py

# Model
model_path: models/foot_pose/best.pt  # or yolov8m-pose.pt for COCO + custom head
backend: yolo_foot  # or yolo_coco / yolo_lower for legacy
device: cpu
conf_threshold: 0.25
iou_threshold: 0.7

# Person selection
person_select: highest_confidence  # highest_confidence | largest_bbox | center

# Temporal smoothing (Savitzky-Golay)
smoothing:
  enabled: true
  method: savgol
  window_length: 11  # odd, FPS-aware if set per-video
  polyorder: 3

# Gait event detection (IC = initial contact, TO = toe-off)
events:
  # Velocity threshold (pixels/frame) for stance vs swing
  velocity_threshold: 2.0
  # Min frames in stability window to declare contact
  stability_frames: 5
  # Min step duration (ms) to filter spurious events
  min_step_duration_ms: 200
  # FPS-aware: derive window from FPS if not set
  fps_aware: true

# Contact classification (heel-strike / toe-walk / flat)
contact:
  # Pitch angle threshold (deg): heel lower than toe => heel-strike
  pitch_threshold_deg: 8.0
  # Time delta (ms): heel stabilizes first vs toe
  stabilization_delta_ms: 50
  # Flat: both stabilize within this window (ms)
  flat_window_ms: 80
  # Velocity threshold (px/frame) below which a keypoint is "on ground" for flat check
  flat_stable_velocity: 1.5
  # Inter-foot distance threshold (px). If both heel and toe distances are below this,
  # event is marked as overlap/occluded and excluded from primary contact metrics.
  overlap_min_interfoot_px: 40

# Toe-walking bout detection
bouts:
  # Minimum consecutive forefoot-first contacts to form a bout
  min_consecutive: 2

# Calibration for step length and speed (m)
# Options: none | reference_height_px | scale_factor
calibration:
  method: none  # none | reference_height_px | scale_factor_m_per_px
  reference_height_px: null  # e.g. 200 (pixels for known height in frame)
  reference_height_m: 1.7   # known height in meters
  scale_factor_m_per_px: null  # direct: meters per pixel

# Two-stage inference (Stage B foot safeguard)
# When enabled, if Stage A produces overlap / low foot confidence flags,
# a second model runs on cropped foot ROIs to refine foot keypoints.
stage_b:
  enabled: false
  model_path: models/halpe26_stage_b/best.pt
  # Trigger thresholds — Stage B runs if ANY condition fires
  trigger_min_foot_conf: 0.3      # mean foot-kpt confidence below this
  trigger_overlap_flag: true      # run Stage B when overlap_flag is set
  trigger_max_jitter_px: 15.0     # foot keypoint jitter above this (px/frame)
  crop_margin: 0.4                # margin fraction around ankle span for crop
  crop_min_px: 128                # minimum crop side (pixels)
  crop_max_px: 384                # maximum crop side (pixels)

# Output (default "results" → scripts write to analyses/CLI/YYYYMMDD_HHMM; override with --output-dir to set a custom run dir)
output_dir: results
save_per_event_csv: true
save_per_step_csv: true
save_summary_json: true
save_annotated_video: false
