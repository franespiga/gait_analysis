# HALPE-26 body keypoints (AlphaPose / Halpe Full-Body first 26 keypoints)
# Used by: infer_video.py for 26-keypoint models; convert_halpe26_to_yolo_pose output
# See: docs/train_halpe.md

name: halpe26
description: "HALPE-26 body keypoints (nose, eyes, ears, shoulders, elbows, wrists, hips, knees, ankles, head, neck, hip, L/R big toe, small toe, heel)"

# Keypoint names in order (index 0–25)
keypoints:
  - Nose
  - LEye
  - REye
  - LEar
  - REar
  - LShoulder
  - RShoulder
  - LElbow
  - RElbow
  - LWrist
  - RWrist
  - LHip
  - RHip
  - LKnee
  - RKnee
  - LAnkle
  - RAnkle
  - Head
  - Neck
  - Hip
  - LBigToe
  - RBigToe
  - LSmallToe
  - RSmallToe
  - LHeel
  - RHeel

# Skeleton edges for visualization (head/neck, arms, torso, legs, feet)
skeleton:
  - [0, 17]   # Nose - Head
  - [0, 18]   # Nose - Neck
  - [17, 18]  # Head - Neck
  - [5, 6]    # LShoulder - RShoulder
  - [5, 7]    # LShoulder - LElbow
  - [7, 9]    # LElbow - LWrist
  - [6, 8]    # RShoulder - RElbow
  - [8, 10]   # RElbow - RWrist
  - [5, 11]   # LShoulder - LHip
  - [6, 12]   # RShoulder - RHip
  - [11, 12]  # LHip - RHip
  - [11, 13]  # LHip - LKnee
  - [13, 15]  # LKnee - LAnkle
  - [12, 14]  # RHip - RKnee
  - [14, 16]  # RKnee - RAnkle
  - [18, 19]  # Neck - Hip
  - [11, 19]  # LHip - Hip
  - [12, 19]  # RHip - Hip
  - [15, 24]  # LAnkle - LHeel
  - [15, 20]  # LAnkle - LBigToe
  - [24, 20]  # LHeel - LBigToe
  - [20, 22]  # LBigToe - LSmallToe
  - [24, 22]  # LHeel - LSmallToe
  - [16, 25]  # RAnkle - RHeel
  - [16, 21]  # RAnkle - RBigToe
  - [25, 21]  # RHeel - RBigToe
  - [21, 23]  # RBigToe - RSmallToe
  - [25, 23]  # RHeel - RSmallToe

# Mapping from HALPE-26 to 6 foot keypoints for gait pipeline (L_HEEL, L_BIG_TOE, L_SMALL_TOE, R_*)
halpe26_to_foot6: [24, 20, 22, 25, 21, 23]

# Foot keypoint indices in this schema (for gait)
indices:
  L_HEEL: 24
  L_BIG_TOE: 20
  L_SMALL_TOE: 22
  R_HEEL: 25
  R_BIG_TOE: 21
  R_SMALL_TOE: 23
