# ─────────────────────────────────────────────────────────────────────
# Stage B — Foot / lower-leg ROI pose training config (safeguard)
# Model:  yolo11n-pose  (nano — crops are small so a lighter model suffices)
# Target: resolve foot keypoints when Stage A flags overlap / low conf
# ─────────────────────────────────────────────────────────────────────

# ── Model ────────────────────────────────────────────────────────────
model: yolo11n-pose.pt
task: pose

# ── Data ─────────────────────────────────────────────────────────────
# Generated by scripts/build_foot_crops.py from the same HALPE source
data: data/halpe26_foot_crops/foot_crops.yaml

# ── Resolution ───────────────────────────────────────────────────────
# Crops are ~256–384 px; train at 320 with moderate multi-scale
imgsz: 320
multi_scale: 0.25               # ±25 % → 240–400

# ── Schedule ─────────────────────────────────────────────────────────
epochs: 150
patience: 20
batch: 32                       # small images → larger batch
workers: 8

# ── Optimizer ────────────────────────────────────────────────────────
optimizer: auto
lr0: 0.01
lrf: 0.001
cos_lr: true
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
momentum: 0.937
weight_decay: 0.0005

# ── Loss ─────────────────────────────────────────────────────────────
box: 7.5
cls: 0.5
dfl: 1.5
pose: 16.0                     # higher pose weight for crop model
kobj: 1.0

# ── AMP / deterministic ─────────────────────────────────────────────
amp: true
deterministic: true
seed: 42

# ── Augmentation ─────────────────────────────────────────────────────
augment: true
hsv_h: 0.02
hsv_s: 0.7
hsv_v: 0.5
degrees: 3.0
translate: 0.1
scale: 0.3
shear: 1.0
perspective: 0.0001
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.1
copy_paste: 0.0
close_mosaic: 10
erasing: 0.2

# ── Pretrained / resume ─────────────────────────────────────────────
pretrained: true
resume: false

# ── Output ───────────────────────────────────────────────────────────
project: runs/pose
name: halpe26_stage_b_foot
save: true
exist_ok: false
plots: true
val: true

# ── Per-keypoint weights (all foot points — 26 kpts, subset active) ──
# Same HALPE-26 layout but the crop contains mostly lower body.
# Ankles 2.0, foot points 3.0
kpt_weights:
  - 1.0   # 0  Nose
  - 1.0   # 1  LEye
  - 1.0   # 2  REye
  - 1.0   # 3  LEar
  - 1.0   # 4  REar
  - 1.0   # 5  LShoulder
  - 1.0   # 6  RShoulder
  - 1.0   # 7  LElbow
  - 1.0   # 8  RElbow
  - 1.0   # 9  LWrist
  - 1.0   # 10 RWrist
  - 1.0   # 11 LHip
  - 1.0   # 12 RHip
  - 1.0   # 13 LKnee
  - 1.0   # 14 RKnee
  - 2.0   # 15 LAnkle
  - 2.0   # 16 RAnkle
  - 1.0   # 17 Head
  - 1.0   # 18 Neck
  - 1.0   # 19 Hip
  - 3.0   # 20 LBigToe
  - 3.0   # 21 RBigToe
  - 3.0   # 22 LSmallToe
  - 3.0   # 23 RSmallToe
  - 3.0   # 24 LHeel
  - 3.0   # 25 RHeel
